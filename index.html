<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPS ARENA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230F0F23'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%23A78BFA'%3E%E2%9C%AA%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0F0F23; --fg:#E2E8F0; --card:#1E1C35; --muted:#94A3B8;
  --border:#4C1D95; --primary:#7C3AED; --secondary:#A78BFA;
  --accent:#F43F5E; --destructive:#EF4444;
  --green:#00FF00; --cyan:#00FFFF; --magenta:#FF00FF; --amber:#FFB800;
}
/* Force text presentation (U+FE0E) so the hands take the neon colour
   instead of being painted by the colour-emoji font. */
.hands span,.glyph,.vglyph{
  font-family:"Segoe UI Symbol","Noto Sans Symbols2","DejaVu Sans",monospace;
  -webkit-text-fill-color:currentColor;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px 16px;background:var(--bg);color:var(--fg);
  font-family:"Cascadia Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  font-weight:600;
}
.app{width:100%;max-width:760px}
.logo{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:6px}
.logo .hands{
  font-size:clamp(1.9rem,6vw,2.8rem);line-height:1;
  display:flex;gap:10px;
}
.logo .hands span{
  filter:drop-shadow(0 0 10px currentColor);
  animation:wave 2.6s ease-in-out infinite;
}
.logo .hands span:nth-child(1){color:var(--green);animation-delay:0s}
.logo .hands span:nth-child(2){color:var(--cyan);animation-delay:.25s}
.logo .hands span:nth-child(3){color:var(--accent);animation-delay:.5s}
@keyframes wave{
  0%,60%,100%{transform:translateY(0) rotate(0)}
  70%{transform:translateY(-7px)}
  80%{transform:translateY(0)}
  90%{transform:translateY(-3px)}
}
.logo .wordmark{text-align:left}
.logo .wordmark h1{
  font-size:clamp(1.1rem,4vw,1.7rem);line-height:1.1;letter-spacing:.1em;
  color:var(--fg);font-weight:800;
}
.logo .wordmark h1 em{font-style:normal;color:var(--secondary)}
.logo .wordmark h1{margin-bottom:0}

.panel{border:2px solid var(--border);background:var(--card);padding:14px 16px;margin-bottom:14px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;text-align:center}
.side{display:flex;flex-direction:column;gap:6px}
.label{font-size:.7rem;letter-spacing:.22em;color:var(--muted)}
.side.you .label{color:var(--green)}
.side.cpu .label{color:var(--magenta)}
.score{font-size:1.9rem;font-weight:800;line-height:1}
.side.you .score{color:var(--green)}
.side.cpu .score{color:var(--magenta)}
.bar{height:9px;background:#27273B;overflow:hidden}
.bar i{display:block;height:100%;transition:width .32s cubic-bezier(.4,0,.2,1)}
.side.you .bar i{background:var(--green);box-shadow:0 0 10px var(--green)}
.side.cpu .bar i{background:var(--magenta);box-shadow:0 0 10px var(--magenta)}
.meta{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:12px;padding-top:10px;border-top:1px solid var(--border);
  font-size:.72rem;letter-spacing:.12em;color:var(--muted)
}
.meta .streak{color:var(--amber)}
.meta .target{color:var(--secondary)}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{
  background:var(--card);border:2px solid var(--border);padding:14px 8px 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
  color:var(--fg);font:inherit;text-align:center;
}
.card:hover,.card:focus-visible{border-color:var(--secondary);transform:translateY(-2px);outline:none}
.card:hover{box-shadow:0 0 18px rgba(124,58,237,.45)}
.card[data-move="rock"]:hover,.card[data-move="rock"]:focus-visible{box-shadow:0 0 18px rgba(0,255,0,.35)}
.card[data-move="paper"]:hover,.card[data-move="paper"]:focus-visible{box-shadow:0 0 18px rgba(0,255,255,.35)}
.card[data-move="scissors"]:hover,.card[data-move="scissors"]:focus-visible{box-shadow:0 0 18px rgba(244,63,94,.35)}
.card:active{transform:translateY(0)}
.glyph{font-size:2.6rem;line-height:1}
.card[data-move="rock"] .glyph{text-shadow:0 0 14px var(--green)}
.card[data-move="paper"] .glyph{text-shadow:0 0 14px var(--cyan)}
.card[data-move="scissors"] .glyph{text-shadow:0 0 14px var(--accent)}
.hotkey{font-size:.68rem;letter-spacing:.2em;color:var(--muted)}
.name{font-size:.82rem;letter-spacing:.2em}
.hint{text-align:center;font-size:.7rem;letter-spacing:.18em;color:var(--muted);margin-top:10px}
.hint b{color:var(--fg)}

.history{display:flex;gap:5px;flex-wrap:wrap;font-size:.78rem;letter-spacing:.1em}
.history span{padding:2px 7px;border:1px solid var(--border)}
.history .W{color:var(--green)}
.history .L{color:var(--destructive)}
.history .T{color:var(--muted)}

.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.fighter{display:flex;flex-direction:column;align-items:center;gap:6px}
.fighter .glyph{font-size:2.2rem;line-height:1}
.fighter.you .glyph{filter:drop-shadow(0 0 12px var(--green))}
.fighter.cpu .glyph{filter:drop-shadow(0 0 12px var(--magenta))}
.fighter .who{font-size:.68rem;letter-spacing:.22em;color:var(--muted)}
.vs{font-size:1.1rem;font-weight:800;color:var(--amber);text-shadow:0 0 12px var(--amber)}
.scrambling .fighter.cpu .glyph{animation:jitter .11s steps(2) infinite}
@keyframes jitter{
  0%{transform:translateX(-2px) skewX(-4deg)}
  50%{transform:translateX(2px) skewX(4deg)}
  100%{transform:translateX(-2px) skewX(-4deg)}
}

.verdict{text-align:center;padding:16px}
.verdict .vglyph{font-size:2.4rem;line-height:1;margin-bottom:6px}
.verdict .word{font-size:clamp(1.3rem,5vw,2rem);font-weight:800;letter-spacing:.16em}
.verdict.win{border-color:var(--green)}
.verdict.win .vglyph{filter:drop-shadow(0 0 14px var(--green))}
.verdict.win .word{color:var(--green);text-shadow:0 0 16px var(--green)}
.verdict.lose{border-color:var(--destructive);animation:shake .32s ease}
.verdict.lose .vglyph{filter:drop-shadow(0 0 14px var(--destructive))}
.verdict.lose .word{color:var(--destructive);text-shadow:0 0 16px var(--destructive)}
.verdict.tie .word{color:var(--muted)}
.verdict.tie .vglyph{filter:drop-shadow(0 0 10px var(--muted))}
.verdict .detail{margin-top:8px;font-size:.76rem;letter-spacing:.2em;color:var(--muted)}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

.report{text-align:center}
.report .line1{font-size:1.15rem;font-weight:800;letter-spacing:.12em;margin-bottom:10px}
.report .line1.win{color:var(--green)}
.report .line1.lose{color:var(--destructive);text-shadow:0 0 16px var(--destructive)}
.report .line1.tie{color:var(--secondary)}
.stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:.72rem;letter-spacing:.14em;color:var(--muted)}
.stats b{display:block;font-size:1.3rem;color:var(--fg);margin-top:3px}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  flex:1;min-width:150px;min-height:48px;padding:12px 16px;
  background:var(--card);border:2px solid var(--border);color:var(--fg);
  font:inherit;font-size:.8rem;letter-spacing:.18em;cursor:pointer;
  transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease;
}
.btn:hover,.btn:focus-visible{border-color:var(--secondary);box-shadow:0 0 16px rgba(124,58,237,.5);outline:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.primary{border-color:var(--primary)}

.shake{animation:shake .32s ease}
.err{color:var(--destructive);text-align:center;font-size:.74rem;letter-spacing:.16em;min-height:1.2em}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:520px){
  .panel{padding:12px}
  .cards{gap:7px}
  .logo{gap:12px}
  .glyph{font-size:2rem}
  .card .glyph{font-size:2rem}
  .fighter .glyph{font-size:1.9rem}
  .duel{gap:6px}
}
</style>
</head>
<body>
<main class="app">
  <header class="logo">
    <div class="hands" aria-hidden="true"><span>&#9994;&#65038;</span><span>&#9995;&#65038;</span><span>&#9996;&#65038;</span></div>
    <div class="wordmark">
      <h1>ROCK <em>PAPER</em> SCISSORS</h1>
    </div>
  </header>

  <section class="panel">
    <div class="hud">
      <div class="side you">
        <span class="label">YOU</span>
        <span class="score" id="sYou">0</span>
        <span class="bar"><i id="bYou" style="width:0%"></i></span>
      </div>
      <div>
        <span class="label" id="round">ROUND 1</span>
      </div>
      <div class="side cpu">
        <span class="label">CPU</span>
        <span class="score" id="sCpu">0</span>
        <span class="bar"><i id="bCpu" style="width:0%"></i></span>
      </div>
    </div>
    <div class="meta">
      <span class="streak" id="streak">STREAK x0</span>
      <span class="target" id="mode">FIRST TO 3</span>
    </div>
  </section>

  <section class="panel" id="arena">
    <div class="cards" id="cards"></div>
    <p class="hint">PRESS <b>1</b> ROCK &nbsp;<b>2</b> PAPER &nbsp;<b>3</b> SCISSORS &nbsp;&nbsp;<b>Q</b> QUIT</p>
  </section>

  <section class="panel" id="duelPanel" hidden>
    <div class="duel">
      <div class="fighter you">
        <span class="glyph" id="artYou"></span>
        <span class="who" id="nameYou">PLAYER</span>
      </div>
      <span class="vs">VS</span>
      <div class="fighter cpu">
        <span class="glyph" id="artCpu"></span>
        <span class="who" id="nameCpu">OPPONENT</span>
      </div>
    </div>
  </section>

  <section class="panel verdict" id="verdict" hidden>
    <div class="vglyph" id="verdictGlyph" aria-hidden="true"></div>
    <div class="word" id="verdictWord"></div>
    <div class="detail" id="verdictDetail"></div>
  </section>

  <section class="panel" id="historyPanel" hidden>
    <div class="history" id="history"></div>
  </section>

  <section class="panel report" id="report" hidden>
    <div class="line1" id="reportLine"></div>
    <div class="stats">
      <div>WIN RATE<b id="rate">0%</b></div>
      <div>BEST STREAK<b id="best">0</b></div>
      <div>ROUNDS<b id="rounds">0</b></div>
      <div>TIES<b id="ties">0</b></div>
    </div>
  </section>

  <section class="panel" id="setup">
    <div class="actions">
      <button class="btn primary" id="start3">START FIRST TO 3</button>
      <button class="btn" id="start5">FIRST TO 5</button>
      <button class="btn" id="startEndless">ENDLESS</button>
    </div>
    <p class="err" id="err" role="status"></p>
  </section>

  <section class="panel actions" id="after" hidden>
    <button class="btn primary" id="rematch">REMATCH</button>
    <button class="btn" id="exit">EXIT</button>
  </section>
</main>

<script>
const MOVES = ["rock","paper","scissors"];
const BEATS = {rock:"scissors", paper:"rock", scissors:"paper"};
const KEYS = {"1":"rock","2":"paper","3":"scissors"};
const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => reduced ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

let state = {you:0, cpu:0, rounds:0, ties:0, streak:0, best:0, last:null, target:3, history:[]};
let busy = false;

/* \uFE0E requests the monochrome text glyph, not the colour emoji. */
const HAND = {rock:"\u270A\uFE0E", paper:"\u270B\uFE0E", scissors:"\u270C\uFE0E"};
const VERDICT_GLYPH = {win:"\u270A\uFE0E", lose:"\u270C\uFE0E", tie:"\u270B\uFE0E"};

$("cards").innerHTML = MOVES.map((m,i) => `
  <button class="card" data-move="${m}" aria-label="${m}">
    <span class="glyph">${HAND[m]}</span>
    <span class="hotkey">[${i+1}]</span>
    <span class="name">${m.toUpperCase()}</span>
  </button>`).join("");

function render(){
  $("sYou").textContent = state.you;
  $("sCpu").textContent = state.cpu;
  const scale = state.target || Math.max(state.you, state.cpu, 1);
  $("bYou").style.width = Math.min(100, state.you/scale*100) + "%";
  $("bCpu").style.width = Math.min(100, state.cpu/scale*100) + "%";
  $("round").textContent = "ROUND " + (state.rounds+1);
  $("mode").textContent = state.target ? "FIRST TO " + state.target : "ENDLESS";
  $("streak").textContent = state.streak >= 2
    ? "STREAK x" + state.streak + " \u00b7 " + BEATS[state.last] + " was right"
    : "STREAK x0";
  const h = state.history.slice(-16);
  $("historyPanel").hidden = h.length === 0;
  $("history").innerHTML = h.map(r => `<span class="${r}">${r}</span>`).join("");
}

function reset(target){
  state = {you:0, cpu:0, rounds:0, ties:0, streak:0, best:0, last:null, target, history:[]};
  $("setup").hidden = true;
  $("after").hidden = true;
  $("report").hidden = true;
  $("verdict").hidden = true;
  $("duelPanel").hidden = false;
  render();
}

async function play(move){
  if (busy) return;
  busy = true;
  const cpu = pick(MOVES);
  $("duelPanel").classList.remove("scrambling");
  $("duelPanel").hidden = false;
  $("artYou").textContent = HAND[move];
  $("nameYou").textContent = "PLAYER \u00b7 " + move.toUpperCase();
  $("artCpu").textContent = "";
  $("nameCpu").textContent = "OPPONENT \u00b7 ???";

  if (!reduced){
    $("duelPanel").classList.add("scrambling");
    for (let i=0;i<9;i++){
      $("artCpu").textContent = HAND[pick(MOVES)];
      await sleep(60 + i*14);
    }
    $("duelPanel").classList.remove("scrambling");
  }
  $("artCpu").textContent = HAND[cpu];
  $("nameCpu").textContent = "OPPONENT \u00b7 " + cpu.toUpperCase();
  await sleep(220);

  const outcome = move === cpu ? "tie" : BEATS[move] === cpu ? "win" : "lose";
  const v = $("verdict");
  v.className = "panel verdict " + outcome;
  v.hidden = false;
  $("verdictGlyph").textContent = VERDICT_GLYPH[outcome];
  $("verdictWord").textContent = outcome === "win" ? "YOU WIN" : outcome === "lose" ? "YOU LOSE" : "DRAW";
  $("verdictDetail").textContent = outcome === "win"
    ? move.toUpperCase() + " BEATS " + cpu.toUpperCase()
    : outcome === "lose"
      ? cpu.toUpperCase() + " BEATS " + move.toUpperCase()
      : "BOTH CHOSE " + move.toUpperCase();

  state.rounds++;
  if (outcome === "win"){ state.you++; state.streak++; }
  else if (outcome === "lose"){ state.cpu++; state.streak = 0; }
  else { state.ties++; state.streak = 0; }
  state.best = Math.max(state.best, state.streak);
  state.last = move;
  state.history.push({win:"W", lose:"L", tie:"T"}[outcome]);
  render();

  if (state.target && Math.max(state.you, state.cpu) >= state.target){
    await sleep(650);
    finish();
  }
  busy = false;
}

function finish(){
  const r = $("report");
  r.hidden = false;
  const outcome = state.you > state.cpu ? "win" : state.you < state.cpu ? "lose" : "tie";
  const line = $("reportLine");
  line.className = "line1 " + outcome;
  line.textContent = "MATCH OVER \u00b7 YOU " + state.you + " : " + state.cpu + " CPU";
  $("rate").textContent = Math.round(state.you/(state.rounds||1)*100) + "%";
  $("best").textContent = state.best;
  $("rounds").textContent = state.rounds;
  $("ties").textContent = state.ties;
  $("cards").style.display = "none";
  document.querySelector(".hint").style.display = "none";
  $("after").hidden = false;
  $("rematch").focus();
}

$("cards").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) play(card.dataset.move);
});
$("start3").onclick = () => reset(3);
$("start5").onclick = () => reset(5);
$("startEndless").onclick = () => reset(0);
$("rematch").onclick = () => {
  $("report").hidden = true;
  $("after").hidden = true;
  $("cards").style.display = "";
  document.querySelector(".hint").style.display = "";
  reset(state.target);
};
$("exit").onclick = () => {
  $("err").textContent = "SIGNAL LOST \u2014 RELOAD TO RE-ENTER THE ARENA";
  $("after").hidden = true;
  $("report").hidden = true;
  $("verdict").hidden = true;
  $("duelPanel").hidden = true;
  $("cards").style.display = "";
  document.querySelector(".hint").style.display = "";
  $("setup").hidden = false;
};

document.addEventListener("keydown", e => {
  const k = e.key;
  if (k === "q" || k === "Q"){
    if ($("after").hidden === false) $("exit").click();
    else $("err").textContent = "NO ACTIVE MATCH";
    return;
  }
  if (k === "Enter"){
    if ($("setup").hidden === false){ $("start3").click(); return; }
    if ($("after").hidden === false){ $("rematch").click(); return; }
  }
  const move = KEYS[k];
  if (move){
    if ($("cards").style.display === "none"){ $("err").textContent = "MATCH OVER \u2014 PRESS R TO REMATCH"; return; }
    e.preventDefault();
    play(move);
  }
  if (k === "r" || k === "R"){
    if ($("after").hidden === false) $("rematch").click();
  }
});

$("start3").focus();
</script>
</body>
</html>
